[package]
name = "c2pa-tool"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4.5.20", features = ["derive"] }
wit-bindgen = { version = "0.39", features = ["default"] }
wit-bindgen-rt = { version = "0.39.0", features = ["bitflags"] }
wasi = "0.14.1"

[profile.release]
codegen-units = 1
opt-level = "s"
debug = false
strip = true
lto = true

[package.metadata.component.target]
path = "../wit"
world = "c2pa-tool"

[package.metadata.component.dependencies]
"wasi:io" = { path = "../wit/deps/io" }
"adobe:cai" = { path = "../wit/cai.wit" }
